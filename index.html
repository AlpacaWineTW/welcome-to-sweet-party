/* V22：橫式手機版
   直式維持原版；橫式改為左圖右內容，並允許垂直捲動作為保底。 */
@media (orientation: landscape) {
  html, body {
    min-height: 100%;
    height: auto;
    overflow-y: auto;
    background: var(--cream);
  }

  body { overflow-x: hidden; }

  .app {
    width: 100%;
    max-width: none;
    height: auto;
    min-height: 100dvh;
    overflow: visible;
  }

  .screen {
    position: relative;
    inset: auto;
    display: none;
    width: 100%;
    min-height: 100dvh;
    height: auto;
    overflow: visible;
    opacity: 1;
    transform: none;
    transition: none;
  }

  .screen.active {
    display: flex;
    pointer-events: auto;
  }

  /* 首頁：左側完整直式 KV，右側 CTA。 */
  #home {
    flex-direction: row;
    align-items: stretch;
  }

  #home .hero {
    width: auto;
    height: 100dvh;
    max-width: 62vw;
    aspect-ratio: 1080 / 1500;
    flex: 0 0 auto;
  }

  #home .content.homeActions {
    min-width: 280px;
    justify-content: center;
    padding: clamp(18px, 3vw, 34px);
  }

  /* 遊戲頁：左圖右選項。圖片依高度縮放，不再跟橫向寬度一起暴增。 */
  #game {
    flex-direction: row;
    align-items: stretch;
  }

  #game .gameVisual {
    width: min(50vw, 100dvh);
    height: min(50vw, 100dvh);
    max-height: 100dvh;
    aspect-ratio: 1 / 1;
    flex: 0 0 auto;
    align-self: center;
  }

  #game .choices {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 100dvh;
    justify-content: center;
    padding: clamp(14px, 2.2vw, 24px);
    gap: clamp(7px, 1.3vh, 11px);
  }

  #game .prompt {
    margin-top: 0;
    margin-bottom: clamp(4px, 1vh, 9px);
    font-size: clamp(19px, 3vw, 24px);
  }

  #game .choice {
    padding-top: clamp(10px, 1.7vh, 14px);
    padding-bottom: clamp(10px, 1.7vh, 14px);
  }

  /* 成功／失敗結果：左圖右結果文字。 */
  #success, #fail {
    flex-direction: row;
    align-items: stretch;
  }

  #success .resultImage, #fail .resultImage {
    width: min(50vw, 100dvh);
    height: min(50vw, 100dvh);
    max-height: 100dvh;
    aspect-ratio: 1 / 1;
    flex: 0 0 auto;
    align-self: center;
  }

  #success .resultInfo, #fail .resultInfo {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 100dvh;
    justify-content: center;
    padding: clamp(16px, 2.5vw, 30px);
  }

  #success .resultInfo h2, #fail .resultInfo h2 {
    margin-top: 0;
  }

  .result-replay {
    margin-top: clamp(26px, 5vh, 42px) !important;
  }

  /* 純文字頁：橫式縮短上下留白並保持置中。 */
  #rules, #connect {
    min-height: 100dvh;
    justify-content: center;
    overflow-y: auto;
    padding-top: clamp(18px, 4vh, 32px);
    padding-bottom: clamp(18px, 4vh, 32px);
  }

  #rules .typebox {
    min-height: 0;
  }
}

/* V30：全站預留底部 10% 警語區（暫時色塊） */
:root {
  --warning-h: 10dvh;

}

  height: 100%;
  min-height: 100%;

}

.app {

/* 純文字頁的置中基準也改為警語上方的 90% 區域 */
#rules, #connect {

}

/* 橫式：所有左右版型只使用上方 90dvh，警語固定在最下方 10dvh */
@media (orientation: landscape) {

@media (orientation: portrait) {

/* V32：直式遊戲頁只將問題文字往下微調，按鈕位置維持 V31 */

/* V33：首頁主視覺依方向使用不同版型。
   目前仍是 HTML 暫代主視覺；之後可分別換成：
   直式 1080×1500、橫式 1080×1080。 */
@media (orientation: portrait) {
  #home .hero {
    width: 100% !important;
    aspect-ratio: 1080 / 1500 !important;
    height: auto !important;
    max-height: calc(var(--content-h) - 96px) !important;

@media (orientation: landscape) {

    width: min(50vw, var(--content-h)) !important;
    height: min(50vw, var(--content-h)) !important;
    aspect-ratio: 1 / 1 !important;
    flex: 0 0 auto !important;
  }
}


/* V36：從 V34 重做短螢幕捲動保護
   不改原本 flex / screen 尺寸邏輯，只讓「目前顯示的頁面」在內容超高時自行捲動。
   底部 10% 警語仍固定不動。 */
.screen.active {
  overflow-x: hidden !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  scrollbar-width: none;
}
.screen.active::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* 只有直式短畫面才把需要完整保留的內容改為不可壓縮，
   讓超出的部分形成真正可捲動的內容高度，而不是被 flex 壓扁或裁掉。 */
@media (orientation: portrait) and (max-height: 760px) {
  #game.active .gameVisual,
  #success.active .resultImage,
  #fail.active .resultImage {
    flex-shrink: 0 !important;
  }

  #game.active .choices,
  #success.active .resultInfo,
  #fail.active .resultInfo {
    flex: 0 0 auto !important;
    min-height: auto !important;
  }

  #game.active .choices {
    padding-bottom: 24px !important;
  }

  #success.active .resultInfo,
  #fail.active .resultInfo {
    padding-bottom: 28px !important;
  }

  /* 純文字頁內容若真的超高，也由該頁本身自然捲動。 */
  #rules.active,
  #connect.active {
    overflow-y: auto !important;
  }
}

/* 橫式沿用 V34 原排版；極矮時 active page 仍可自然捲動。 */
@media (orientation: landscape) {
  .screen.active {
    overflow-y: auto !important;
  }
}


/* V37：跳轉頁 CTA 在手機、桌面窄視窗與橫式都強制水平置中 */
#rules .cta {
  display: block !important;
  margin-left: auto !important;
  margin-right: auto !important;
  align-self: center !important;
}


/* V38：跳轉頁以「整個可用畫面」作為水平置中基準，
   避免桌面窄視窗時文字容器寬度影響 CTA 位置。 */
#rules {
  width: 100% !important;
  box-sizing: border-box !important;
  align-items: center !important;
}

#rules .typebox {
  width: 100% !important;
  max-width: none !important;
  box-sizing: border-box !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  text-align: center !important;
  align-items: center !important;
}

#rules .typebox > * {
  margin-left: auto;
  margin-right: auto;
}

#rules .cta {
  display: block !important;
  margin-left: auto !important;
  margin-right: auto !important;
  align-self: center !important;
}

/* 保留原本橫式 CTA 的寬度設定，只修正置中基準 */
@media (orientation: landscape) {
  #rules .cta {
    margin-left: auto !important;
    margin-right: auto !important;
  }
}
